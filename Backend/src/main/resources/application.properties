spring.application.name=Xpensto

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xpensto}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#create update table based on entity
spring.jpa.hibernate.ddl-auto=update

# to show sql queries in the console so we can see what spring is doing
spring.jpa.show-sql=true

# make sql format easy to read
spring.jpa.properties.hibernate.format_sql=true

# helps hibernate generate mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
